name: deploy-prod
on:
  push:
    tags: ['release-*']
permissions:
  contents: read
concurrency:
  group: steven-log-prod
  cancel-in-progress: false
jobs:
  build-deploy:
    if: github.repository == 'steven-labs/steven-log'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release from main
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#release-}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: registry.home201.com
          username: ${{ secrets.ZOT_USER }}
          password: ${{ secrets.ZOT_PASS }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: registry.home201.com/steven-log:${{ env.VERSION }}
          labels: |
            org.opencontainers.image.source=https://github.com/steven-labs/steven-log
            org.opencontainers.image.revision=${{ github.sha }}
      - uses: actions/checkout@v4
        with:
          repository: steven-labs/infra
          ssh-key: ${{ secrets.INFRA_DEPLOY_KEY }}
          path: infra
      - name: Update only Steven Log image in GitOps
        working-directory: infra
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          p = Path('k8s/apps/home201/overlays/prod/kustomization.yaml')
          pattern = r'(name: registry\.home201\.com/steven-log\s*\n\s*newTag: )[^\n]+'
          text, count = re.subn(pattern, lambda m: m[1] + os.environ['VERSION'], p.read_text())
          if count != 1:
              raise SystemExit('Expected exactly one Steven Log image entry')
          p.write_text(text)
          PY
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add k8s/apps/home201/overlays/prod/kustomization.yaml
          git commit -m "steven-log prod -> ${VERSION}"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin main; then exit 0; fi
          done
          exit 1
