name: provision-trend-secrets
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seal:
    if: github.repository == 'steven-labs/steven-log' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Install sealed-box encryption library
        run: python3 -m pip install --disable-pip-version-check PyNaCl==1.6.0
      - name: Seal deployment credentials for steven-labs/trend only
        env:
          ZOT_USER: ${{ secrets.ZOT_USER }}
          ZOT_PASS: ${{ secrets.ZOT_PASS }}
          INFRA_DEPLOY_KEY: ${{ secrets.INFRA_DEPLOY_KEY }}
          TARGET_PUBLIC_KEY: 'tgN5H1szn2E+9zYUl+1V+f02vn6nnfSgcfOB8BHkEn8='
          TARGET_KEY_ID: '3380204578043523366'
        run: |
          python3 - <<'PYTHON'
          import os, json, base64
          from pathlib import Path
          from nacl.public import PublicKey, SealedBox
          box = SealedBox(PublicKey(base64.b64decode(os.environ['TARGET_PUBLIC_KEY'])))
          output = {}
          for name in ['ZOT_USER', 'ZOT_PASS', 'INFRA_DEPLOY_KEY']:
              value = os.environ.get(name, '')
              if not value:
                  raise SystemExit('Required deployment credential unavailable: ' + name)
              output[name] = {'key_id': os.environ['TARGET_KEY_ID'], 'encrypted_value': base64.b64encode(box.encrypt(value.encode())).decode()}
          Path('sealed-trend.json').write_text(json.dumps(output))
          PYTHON
      - uses: actions/upload-artifact@v4
        with:
          name: sealed-trend
          path: sealed-trend.json
          retention-days: 1
