name: seal-agent-trials-deployment-secrets
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seal:
    if: github.repository == 'steven-labs/steven-log' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - run: python3 -m pip install PyNaCl==1.6.0
      - name: Seal only approved credentials for private Agent Trials
        env:
          TARGET_PUBLIC_KEY: HI2Or3ZFYXAzBQ8zBzAxItJB6TgGd8MivGBRSBb5v3w=
          TARGET_KEY_ID: 3380204578043523366
          ZOT_USER: ${{ secrets.ZOT_USER }}
          ZOT_PASS: ${{ secrets.ZOT_PASS }}
          INFRA_DEPLOY_KEY: ${{ secrets.INFRA_DEPLOY_KEY }}
        run: |
          python3 - <<'PYTHON'
          import os, json, base64
          from pathlib import Path
          from nacl.public import PublicKey, SealedBox
          box = SealedBox(PublicKey(base64.b64decode(os.environ['TARGET_PUBLIC_KEY'])))
          output = {}
          for name in ['ZOT_USER', 'ZOT_PASS', 'INFRA_DEPLOY_KEY']:
              value = os.environ.get(name, '')
              if not value:
                  raise SystemExit('Required credential unavailable: ' + name)
              output[name] = {'key_id': os.environ['TARGET_KEY_ID'], 'encrypted_value': base64.b64encode(box.encrypt(value.encode())).decode()}
          Path('sealed.json').write_text(json.dumps(output))
          PYTHON
      - uses: actions/upload-artifact@v4
        with:
          name: agent-trials-sealed
          path: sealed.json
          retention-days: 1
